name: "Checks"

# Static analysis, tests and a debuggable APK for the test phone. Needs no secrets, so it also runs for PRs from
# forks. To make it block merges, require the "Analyze and test" check in the
# branch protection rules.
on:
  pull_request:
    branches:
      - master
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Debuggable, so agents can `run-as` into it on the test phone. Only
      # arm64 keeps the download small; CONTACT_EMAIL stays unset because
      # fork PRs get no secrets.
      - name: Build
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: transportia-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
